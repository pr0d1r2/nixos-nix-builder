---
output:
  - failure

pre-commit:
  commands:
    ascii-only:
      glob: '*.{sh,nix,yml,toml,bats,dic,txt,just,jsonc}'
    file-size-check: {}
    missing-final-newline: {}
    changelog-touched:
      files: git diff --cached --name-only -- ':!LICENSE' ':!lefthook.yml' ':!.narrow-language-*.dic' ':!.github/**' ':!SPEC.md' ':!tests/**' ':!agent/**'
      run: timeout 30 lefthook-changelog-touched {files}
    nix-flake-check:
      skip: true
    nix-flake-eval:
      skip: true
      run: "true"
    narrow-language-css:
      skip: true
    narrow-language-css-compact:
      skip: true
      run: "true"
    narrow-language-css-freeze:
      skip: true
      run: "true"
    narrow-language-erb:
      skip: true
    narrow-language-erb-compact:
      skip: true
      run: "true"
    narrow-language-erb-freeze:
      skip: true
      run: "true"
    narrow-language-hcl:
      skip: true
    narrow-language-hcl-compact:
      skip: true
      run: "true"
    narrow-language-hcl-freeze:
      skip: true
      run: "true"
    narrow-language-javascript:
      skip: true
    narrow-language-javascript-compact:
      skip: true
      run: "true"
    narrow-language-javascript-freeze:
      skip: true
      run: "true"
    narrow-language-other:
      glob: '{justfile,*.yml,*.yaml,*.toml,**/*.tcl,*.json,*.jsonc,*.envrc}'
      env:
        NARROW_LANGUAGE_DICT: .narrow-language-other.dic
        NARROW_LANGUAGE_EXCLUDE_FILES: "LICENSE"
    narrow-language-python:
      skip: true
    narrow-language-python-compact:
      skip: true
      run: "true"
    narrow-language-python-freeze:
      skip: true
      run: "true"
    narrow-language-ruby:
      skip: true
    narrow-language-ruby-compact:
      skip: true
      run: "true"
    narrow-language-ruby-freeze:
      skip: true
      run: "true"
    narrow-language-scss:
      skip: true
    narrow-language-scss-compact:
      skip: true
      run: "true"
    narrow-language-scss-freeze:
      skip: true
      run: "true"
    narrow-language-terraform:
      skip: true
    narrow-language-terraform-compact:
      skip: true
      run: "true"
    narrow-language-terraform-freeze:
      skip: true
      run: "true"
    narrow-language-typescript:
      skip: true
    narrow-language-typescript-compact:
      skip: true
      run: "true"
    narrow-language-typescript-freeze:
      skip: true
      run: "true"
    no-shell-functions: {}
    skill-registered:
      env:
        LEFTHOOK_SKILL_REGISTERED_FILE: CLAUDE.md
        LEFTHOOK_SKILL_REGISTERED_PREFIX: "@agent/set/"
        LEFTHOOK_SKILL_REGISTERED_STRIP: "agent/set/"
    trailing-whitespace: {}
    typos: {}
    unicode-lint: {}

