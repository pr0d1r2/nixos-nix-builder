        LEFTHOOK_SKILL_REGISTERED_PREFIX: "@agent/set/"
        LEFTHOOK_SKILL_REGISTERED_STRIP: "agent/set/"
    smoke-conditional:
      run: timeout 1800 bash scripts/lefthook/smoke-conditional.sh
    live-conditional:
      run: timeout 600 bash scripts/lefthook/live-conditional.sh
    trailing-whitespace: {}
    typos: {}
    unicode-lint: {}

