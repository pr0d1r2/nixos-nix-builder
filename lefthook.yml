    narrow-language-typescript:
      skip: true
    narrow-language-typescript-compact:
      skip: true
      run: "true"
    narrow-language-typescript-freeze:
      skip: true
      run: "true"
    linter-coverage:
      env:
        LEFTHOOK_LINTER_COVERAGE_DOC: agent/set/skills/linter.md
    linter-coverage-full:
      env:
        LEFTHOOK_LINTER_COVERAGE_DOC: agent/set/skills/linter.md
    no-shell-functions: {}
    skill-registered:
